<!DOCTYPE html>
<html lang="ko">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>Review Photos | News Factory</title>
    <link href="https://fonts.googleapis.com/css2?family=Inter:wght@300;400;500;600;700&display=swap" rel="stylesheet">
    <style>
        :root {
            --bg-base: #000000;
            --bg-secondary: #121212;
            --border: #363636;
            --text-primary: #ffffff;
            --insta-blue: #0095f6;
        }
        body {
            font-family: 'Inter', sans-serif; background-color: var(--bg-base); color: var(--text-primary);
            margin: 0; display: flex; flex-direction: column; align-items: center; min-height: 100vh;
        }
        nav {
            width: 100%; height: 60px; border-bottom: 1px solid var(--border);
            display: flex; align-items: center; padding: 0 20px; justify-content: center;
        }
        .container { width: 100%; max-width: 600px; padding: 30px 20px; }
        
        .header { margin-bottom: 24px; text-align: center; }
        .header h1 { font-size: 1.2rem; font-weight: 700; margin: 0 0 8px 0; }
        .header p { font-size: 0.85rem; color: #a8a8a8; margin: 0; }

        /* 이미지 선택 그리드 */
        .image-grid { display: flex; flex-direction: column; gap: 20px; margin-bottom: 40px; }
        .image-option {
            position: relative; border-radius: 12px; overflow: hidden; border: 2px solid transparent; cursor: pointer;
            transition: all 0.2s;
        }
        .image-option.selected { border-color: var(--insta-blue); transform: scale(1.02); }
        .image-option img { width: 100%; display: block; aspect-ratio: 1; object-fit: cover; }
        
        .image-option .check-mark {
            position: absolute; top: 12px; right: 12px; background: var(--insta-blue);
            color: white; width: 28px; height: 28px; border-radius: 50%;
            display: none; align-items: center; justify-content: center; font-weight: 700;
        }
        .image-option.selected .check-mark { display: flex; }

        .footer-action {
            position: sticky; bottom: 20px; width: 100%; max-width: 600px;
            padding: 0 20px; z-index: 100;
        }
        .btn-publish {
            background-color: var(--insta-blue); color: white; border: none; border-radius: 12px;
            width: 100%; padding: 18px; font-weight: 700; font-size: 1rem; cursor: pointer;
            box-shadow: 0 10px 20px rgba(0,149,246,0.3);
        }
        .btn-back {
            background: transparent; color: #8e8e8e; border: none; width: 100%; padding: 15px;
            font-size: 0.8rem; cursor: pointer;
        }

        .loading-overlay {
            position: fixed; inset: 0; background: black; z-index: 2000;
            display: flex; flex-direction: column; align-items: center; justify-content: center;
        }
        .spinner { width: 40px; height: 40px; border: 3px solid rgba(255,255,255,0.1); border-top-color: var(--insta-blue); border-radius: 50%; animation: spin 0.8s linear infinite; margin-bottom: 20px; }
        @keyframes spin { to { transform: rotate(360deg); } }
    </style>
</head>
<body>
    <nav><div style="font-weight: 700;">Final Review</div></nav>

    <div class="container">
        <div class="header">
            <h1>Select an Image</h1>
            <p>"{{ title }}"</p>
        </div>

        <form action="/select" method="post" id="publish-form">
            <input type="hidden" name="issue_id" value="{{ issue_id }}">
            <input type="hidden" name="selected_title" value="{{ title }}">
            <input type="hidden" name="selected_image" id="final-image" value="{{ images[0] }}">

            <div class="image-grid">
                {% for img in images %}
                <div class="image-option {% if loop.first %}selected{% endif %}" onclick="selectImage('{{ img }}', this)">
                    <img src="{{ img }}">
                    <div class="check-mark">✓</div>
                </div>
                {% endfor %}
            </div>

            <div class="footer-action">
                <button type="submit" class="btn-publish">Finish & Post to Instagram</button>
                <button type="button" class="btn-back" onclick="history.back()">Change Title</button>
            </div>
        </form>
    </div>

    <script>
        function selectImage(url, el) {
            document.querySelectorAll('.image-option').forEach(opt => opt.classList.remove('selected'));
            el.classList.add('selected');
            document.getElementById('final-image').value = url;
            window.scrollTo({ top: document.body.scrollHeight, behavior: 'smooth' });
        }

        document.getElementById('publish-form').onsubmit = function() {
            const btn = document.querySelector('.btn-publish');
            btn.innerHTML = "Uploading Post...";
            btn.disabled = true;
            btn.style.opacity = '0.5';
        };
    </script>
</body>
</html>
